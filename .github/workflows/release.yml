name: Release

# Tag a commit on main as vX.Y.Z and this publishes a GitHub release with
# binaries for every supported platform. Go cross-compiles without CGO, so one
# job builds everything.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Test before shipping
        run: go test -count=1 ./...

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            name="assay_${version}_${goos}_${goarch}"
            binary="assay"
            if [ "$goos" = "windows" ]; then
              binary="assay.exe"
            fi

            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/emoss08/assay/internal/cli.Version=${version}" \
              -o "dist/${name}/${binary}" .

            cp README.md "dist/${name}/"
            cp LICENSE "dist/${name}/"

            if [ "$goos" = "windows" ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              (cd dist && tar -czf "${name}.tar.gz" "${name}")
            fi
            rm -r "dist/${name}"
          done
          (cd dist && sha256sum -- * > "assay_${version}_checksums.txt")

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "assay v${version}" \
            --notes "assay v${version} — see README.md for what it does and BENCHMARKS.md for what it costs." \
            dist/*
